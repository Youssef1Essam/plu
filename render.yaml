services:
  # Backend FastAPI Service
  - type: web
    name: plu-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_AI_EXPLANATIONS
        value: true
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it
      - key: OPENROUTER_API_KEY
        sync: false # Set this in the Render dashboard manually for security

  # Frontend React Static Site
  - type: web
    name: plu-frontend
    env: static
    buildCommand: cd emission-risk-ui && npm install && npm run build
    staticPublishPath: emission-risk-ui/dist
    envVars:
      - key: VITE_API_URL
        value: https://plu-backend.onrender.com # Change this if your backend name differs
